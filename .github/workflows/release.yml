name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Validate release version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Run Release from main'; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Version must be X.Y.Z'; exit 1; }
          last_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          changed=true
          if [ "$last_tag" = "v$version" ]; then changed=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Version: $version; latest release tag: ${last_tag:-none}; changed: $changed" >> "$GITHUB_STEP_SUMMARY"
  checks:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    uses: ./.github/workflows/ci.yml
  npm:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: interop-otp-29.1.1-elixir-1.20.4
          path: .artifacts
      - name: Publish tested npm tarball
        run: |
          version=$(node -p 'require("./package.json").version')
          npm publish ".artifacts/packages/skir-elixir-gen-$version.tgz" --ignore-scripts --access public
  github-release:
    needs: [validate, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v$RELEASE_VERSION" --jq .object.sha 2>/dev/null); then
            test "$tag_sha" = "$GITHUB_SHA" || { echo '::error::Release tag points to another commit'; exit 1; }
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/v$RELEASE_VERSION" -f "sha=$GITHUB_SHA"
          fi
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --verify-tag \
              --title "skir-elixir-gen v$RELEASE_VERSION" --generate-notes
          fi
