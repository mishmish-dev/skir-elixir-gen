name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            test "$RELEASE_TAG" = "v$version" || { echo '::error::Release tag must match package.json version (vX.Y.Z)'; exit 1; }
            node -e 'if (!/^\d+\.\d+\.\d+$/.test(require("./package.json").version)) process.exit(1)'
          fi
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  npm:
    needs: checks
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: interop-otp-29.1.1-elixir-1.20.4
          path: .artifacts
      - name: Publish tested npm tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo '::error::Missing npm_token publishing secret'; exit 1; }
          version=$(node -p 'require("./package.json").version')
          npm publish ".artifacts/packages/skir-elixir-gen-$version.tgz" --ignore-scripts --access public
  hex:
    needs: checks
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.1.1'
          version-type: strict
      - name: Prepare native runtime
        working-directory: runtime
        env:
          MIX_ENV: prod
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked
          mix compile --warnings-as-errors
      - name: Publish Hex runtime
        working-directory: runtime
        env:
          MIX_ENV: prod
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          test -n "$HEX_API_KEY" || { echo '::error::Missing HEX_API_KEY publishing secret'; exit 1; }
          mix hex.publish package --dry-run --yes
          mix hex.publish package --yes
