name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Elixir ${{ matrix.elixir-version }} / OTP ${{ matrix.otp-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        elixir-version: ['1.20.4']
        # Latest stable release of each supported OTP major, checked 2026-10-04.
        otp-version: ['27.3.4.18', '28.5.0.7', '29.1.1']
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}
          version-type: strict
      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          mix local.hex --force
          mix local.rebar --force
      - name: Generator, native runtime, and upstream interoperability
        run: npm run test:all
      - name: Preserve reference vectors on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-otp-${{ matrix.otp-version }}-elixir-${{ matrix.elixir-version }}
          path: .artifacts/
          if-no-files-found: ignore
